name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Documentation-only changes skip the pipeline. The gates below are ~5.5
    # minutes of fixed work (pa11y over 23 URLs, Lighthouse 3x over 6) and none
    # of them read docs/ or *.md — a markdown edit cannot change a built byte.
    # This is NOT a weakened gate: paths-ignore skips only when EVERY changed
    # file matches, so a PR touching any source file still runs everything and
    # bundling code with a README does not sneak it past. Operator-authorized
    # 2026-07-26; DECISIONS same date.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'

permissions:
  contents: read

jobs:
  verify-and-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PUBLIC_ENV: preview
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Step ORDER only. Every gate that ran before still runs, in the same
      # order, with the same short-circuit semantics — `npm run verify` is now
      # `verify:fast && verify:slow`, so a11y failing still stops perf exactly
      # as it always did, and production.yml is untouched. What changes is WHEN
      # the preview becomes reachable.
      #
      # Measured on PR #147 (2026-08-25): the job spent 4m11s inside Lighthouse
      # and that sat IN FRONT OF the upload, so a link that was ready at ~1m45s
      # could not be sent until ~6m30s. The gates that decide whether a client
      # should be shown the page at all are the cheap ones, and they still run
      # BEFORE the deploy: build 11s, check 7s, lint:claims and lint:voice
      # under a second each. A page carrying a banned claim still cannot reach
      # a preview URL.
      - name: Fast gates (build, type/content check, claims + voice linters)
        id: fast_gates
        run: npm run verify:fast

      # Deploys the pre-verified dist/ as-is; the SWA action must never build
      # on its own, or it would bypass the quality gates around it.
      - name: Deploy preview to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

      - name: Preview URL
        if: env.SWA_TOKEN != ''
        run: |
          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.static_web_app_url }}" >> "$GITHUB_STEP_SUMMARY"

      # The slow half, after the upload. Neither script writes to dist/, so the
      # deployed bytes are the audited bytes. The `!cancelled()` guard is
      # load-bearing: without it a failed deploy step would SKIP these and the
      # job would go red having never reported an a11y or perf result. The
      # fast_gates guard stops them running against a dist/ that was never
      # built. Trade accepted (DECISIONS 2026-08-25): if these fail the preview
      # stays up while the PR goes red — correct for a preview, and
      # verify-and-deploy is a required check on neither branch today.
      - name: Slow gates (a11y sweep, Lighthouse budgets)
        if: ${{ !cancelled() && steps.fast_gates.outcome == 'success' }}
        run: npm run verify:slow

  close-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Tear down preview environment
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
