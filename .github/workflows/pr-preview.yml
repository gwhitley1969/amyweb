name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Documentation-only changes skip the pipeline. The gates below are ~5.5
    # minutes of fixed work (pa11y over 23 URLs, Lighthouse 3x over 6) and none
    # of them read docs/ or *.md — a markdown edit cannot change a built byte.
    # This is NOT a weakened gate: paths-ignore skips only when EVERY changed
    # file matches, so a PR touching any source file still runs everything and
    # bundling code with a README does not sneak it past. Operator-authorized
    # 2026-07-26; DECISIONS same date.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'

permissions:
  contents: read

jobs:
  verify-and-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PUBLIC_ENV: preview
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify (build, check, claims lint, a11y, perf budgets)
        run: npm run verify

      # Deploys the pre-verified dist/ as-is; the SWA action must never build
      # on its own, or it would bypass the quality gates above.
      - name: Deploy preview to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

      - name: Preview URL
        if: env.SWA_TOKEN != ''
        run: |
          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.static_web_app_url }}" >> "$GITHUB_STEP_SUMMARY"

  close-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Tear down preview environment
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
